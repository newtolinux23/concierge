    <!-- Script to Handle Multi-Step Logic and Google Sheets Submission -->
    <script>
        // Connected to Della Client Assessments
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx6zprlAcnTvbjZczxnxQoP3rMY4tbE52Yo31Srf6qLOZEvqNGbIU9GyyGg8xfB-har/exec'; 
        
        const form = document.forms['hair-assessment'];
        const successMessage = document.getElementById('success-message');
        const submitBtn = document.getElementById('submit-btn');

        function nextStep(stepNumber) {
            const currentStepNumber = stepNumber - 1;
            const currentStep = document.getElementById('step-' + currentStepNumber);
            
            const inputs = currentStep.querySelectorAll('input[required], select[required], textarea[required]');
            
            for (let i = 0; i < inputs.length; i++) {
                if (!inputs[i].checkValidity()) {
                    inputs[i].reportValidity(); 
                    return; 
                }
            }

            document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
            document.getElementById('step-' + stepNumber).classList.add('active');
        }

        function prevStep(stepNumber) {
            document.querySelectorAll('.form-step').forEach(step => step.classList.remove('active'));
            document.getElementById('step-' + stepNumber).classList.add('active');
        }

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            submitBtn.innerHTML = "Submitting..."; 
            
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    form.style.display = 'none';
                    successMessage.style.display = 'block';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    submitBtn.innerHTML = "Error. Please try again.";
                });
        });
    </script>
